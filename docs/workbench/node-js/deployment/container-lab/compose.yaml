services:
  db:
    image: ${POSTGRES_IMAGE:?Provide reviewed digest}
    environment:
      POSTGRES_DB: notes
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password, app_password]
    volumes:
      - notes_data:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U postgres -d notes"]
      interval: 2s
      timeout: 1s
      retries: 15
    stop_grace_period: 5s
  api:
    image: ${APP_IMAGE:?Provide owned local image}
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Provide reviewed digest}
    depends_on:
      db:
        condition: service_healthy
    secrets: [app_password]
    ports: ["127.0.0.1:0:3000"]
    networks: [private, edge]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/readyz',{signal:AbortSignal.timeout(1500)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 2s
    stop_grace_period: 5s
volumes:
  notes_data:
networks:
  private:
    internal: true
  edge: {}
secrets:
  admin_password:
    file: ./secrets/admin_password
  app_password:
    file: ./secrets/app_password
