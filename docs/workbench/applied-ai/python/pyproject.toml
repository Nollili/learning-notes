[project]
name = "learning-notes-python-lab"
version = "0.1.0"
requires-python = "==3.13.11"
dependencies = [
    "fastapi==0.156.8",
    "httpx==0.28.1",
    "openai==3.35.1",
    "pydantic==2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "langgraph==1.2.17",
    "mypy==2.4.0",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["lab_tests"]
addopts = "-ra"
