<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning-notes chatbot</title><link rel="stylesheet" href="/app.css"><script type="module" src="/app.js"></script></head>
<body><main>
<p>BUILD AI APPS · JAVASCRIPT STARTER</p><h1>Your first learning assistant</h1>
<p>This local study app defaults to an offline simulation. It does not search your notes yet.</p>
<div id="messages" role="log" aria-label="Conversation"></div>
<form id="chat"><label for="question">Your question</label><textarea id="question" maxlength="1000" required placeholder="What does an API do?"></textarea>
<div><button id="send" type="submit">Send</button><button id="stop" type="button" disabled>Stop</button><button id="reset" type="button">Reset conversation</button></div></form>
<p id="status" role="status" aria-live="polite">Ready · offline simulation unless the server was configured for a live model.</p>
</main></body></html>
